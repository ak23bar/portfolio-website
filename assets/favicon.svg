<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
	<rect width="64" height="64" rx="12" fill="#111"/>
	<!-- Matrix background: vertical green lines -->
	<g opacity="0.18">
		<rect x="8" y="0" width="2" height="64" fill="#00ff41"/>
		<rect x="16" y="0" width="2" height="64" fill="#00ff41"/>
		<rect x="24" y="0" width="2" height="64" fill="#00ff41"/>
		<rect x="32" y="0" width="2" height="64" fill="#00ff41"/>
		<rect x="40" y="0" width="2" height="64" fill="#00ff41"/>
		<rect x="48" y="0" width="2" height="64" fill="#00ff41"/>
		<rect x="56" y="0" width="2" height="64" fill="#00ff41"/>
	</g>
	<!-- Chip body -->
	<rect x="16" y="16" width="32" height="32" rx="7" fill="#222" stroke="#00ff41" stroke-width="2"/>
	<rect x="24" y="24" width="16" height="16" rx="3" fill="#181818" stroke="#00ff41" stroke-width="1.2"/>
	<!-- Chip grid pattern -->
	<g stroke="#00ff41" stroke-width="0.7" opacity="0.7">
		<line x1="28" y1="28" x2="36" y2="28"/>
		<line x1="28" y1="32" x2="36" y2="32"/>
		<line x1="28" y1="36" x2="36" y2="36"/>
		<line x1="28" y1="40" x2="36" y2="40"/>
		<line x1="28" y1="28" x2="28" y2="40"/>
		<line x1="32" y1="28" x2="32" y2="40"/>
		<line x1="36" y1="28" x2="36" y2="40"/>
	</g>
	<!-- Pads -->
	<circle cx="16" cy="32" r="2" fill="#00ff41"/>
	<circle cx="48" cy="32" r="2" fill="#00ff41"/>
	<circle cx="32" cy="16" r="2" fill="#00ff41"/>
	<circle cx="32" cy="48" r="2" fill="#00ff41"/>
</svg>
